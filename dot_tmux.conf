set -g mouse on
set -g base-index 1
set -s set-clipboard on

set -as terminal-features ",xterm-ghostty:RGB"

set -g history-limit 50000
set -s focus-events on

set -g renumber-windows on
set -g set-titles on
set -g set-titles-string "#S / #W"

set -g status-justify absolute-centre

setw -g mode-keys vi
