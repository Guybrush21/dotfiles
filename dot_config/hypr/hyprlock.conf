# Hyprland lock screen, Tokyo Night like waybar and swaylock.
# Started by swayidle through logind (see hyprland.lua); try it: loginctl lock-session
#
# shortcuts to clear password buffer: ESC, Ctrl+U, Ctrl+Backspace

$font = Sans

$bg     = rgba(1a1b26ff)
$fg     = rgba(c0caf5ff)
$yellow = rgba(e0af68ff)
$blue   = rgba(7aa2f7ff)
$cyan   = rgba(7dcfffff)
$orange = rgba(ff9e64ff)
$red    = rgba(f7768eff)

general {
    hide_cursor = true
    # Draw right away (solid background first): the desktop must not stay
    # visible before suspending
    immediate_render = true
}

animations {
    enabled = false
}

# Same image as swaylock
background {
    monitor =
    path = ~/login.jpg
    color = $bg
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 2
    rounding = 6

    inner_color = rgba(1a1b26cc)
    outer_color = $yellow
    font_color = $fg
    check_color = $blue
    fail_color = $red
    capslock_color = $orange

    font_family = $font
    placeholder_text = <i>Password…</i>
    fade_on_empty = false
    dots_spacing = 0.3

    shadow_passes = 2

    position = 0, -20
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = $TIME
    color = $fg
    font_size = 90
    font_family = $font
    shadow_passes = 2

    position = -30, 0
    halign = right
    valign = top
}

# DATE, like the waybar clock
label {
    monitor =
    text = cmd[update:60000] LC_TIME=it_IT.UTF-8 date +"%a %d %b"
    color = $cyan
    font_size = 25
    font_family = $font
    shadow_passes = 2

    position = -30, -150
    halign = right
    valign = top
}
